<a href="{% url 'blog:article_detail' article.slug %}" class="border rounded-lg overflow-hidden hover:shadow transition">
    <div class="aspect-video bg-gray-100"></div>
    <div class="p-3">
        <span class="text-xs text-orange-500">{{ article.get_category_display }}</span>
        <h3 class="font-medium text-sm mt-1">{{ article.title }}</h3>
        {% if show_excerpt %}
        <p class="text-xs text-gray-400 mt-1">{{ article.excerpt|default:article.content|truncatewords:12 }}</p>
        {% endif %}
    </div>
</a>
