<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FOODCORE{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">

    <header class="bg-gray-900 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
            <a href="{% url 'core:home' %}" class="text-lg font-bold">
                <span class="text-orange-500">FOOD</span>CORE
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm">
                <a href="{% url 'catalog:product_list' %}" class="hover:text-orange-500">Каталог</a>
                <a href="{% url 'core:about' %}" class="hover:text-orange-500">О компании</a>
                <a href="{% url 'core:b2b' %}" class="hover:text-orange-500">Для профессионалов</a>
                <a href="{% url 'blog:article_list' %}" class="hover:text-orange-500">Рецепты</a>
                <a href="{% url 'core:contacts' %}" class="hover:text-orange-500">Контакты</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="{% url 'orders:cart' %}" class="hover:text-orange-500 relative">
                    🛒 <span id="cart-count" class="absolute -top-2 -right-3 bg-orange-500 text-xs rounded-full w-5 h-5 flex items-center justify-center"
                        hx-get="{% url 'orders:cart_count' %}" hx-trigger="every 1s" hx-swap="innerHTML">0</span>
                </a>
                <a href="/admin/" class="text-xs border border-white/30 px-2 py-1 rounded hover:bg-white/10">Вход</a>
            </div>
        </div>
    </header>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-900 text-gray-400 text-sm mt-16">
        <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-8">
            <div>
                <span class="font-bold text-white"><span class="text-orange-500">FOOD</span>CORE</span>
                <p class="mt-1">Основа вашего меню</p>
            </div>
            <div class="flex gap-12">
                <div class="flex flex-col gap-1">
                    <a href="{% url 'catalog:product_list' %}" class="hover:text-orange-500">Каталог</a>
                    <a href="{% url 'core:about' %}" class="hover:text-orange-500">О нас</a>
                    <a href="{% url 'core:b2b' %}" class="hover:text-orange-500">HoReCa</a>
                </div>
                <div class="flex flex-col gap-1">
                    <span>+375 (29) 123-45-67</span>
                    <span>info@foodcore.by</span>
                </div>
            </div>
        </div>
        <div class="border-t border-gray-800 text-center py-4 text-xs text-gray-600">&copy; 2024 FOODCORE</div>
    </footer>

</body>
</html>
