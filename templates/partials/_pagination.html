{% if pages %}
<nav class="flex items-center justify-center gap-2 mt-8" aria-label="Постраничная навигация">
    {% if prev_url %}
    <a href="{{ prev_url }}" class="fc-btn px-3 py-1 border rounded text-sm hover:border-orange-500 hover:text-orange-500" aria-label="Предыдущая страница">&laquo;</a>
    {% endif %}
    {% for item in pages %}
        {% if item.is_current %}
        <span class="px-3 py-1 bg-orange-500 text-white rounded text-sm" aria-current="page">{{ item.n }}</span>
        {% elif item.n %}
        <a href="{{ item.url }}" class="fc-btn px-3 py-1 border rounded text-sm hover:border-orange-500 hover:text-orange-500">{{ item.n }}</a>
        {% else %}
        <span class="px-1 text-gray-400 text-sm">…</span>
        {% endif %}
    {% endfor %}
    {% if next_url %}
    <a href="{{ next_url }}" class="fc-btn px-3 py-1 border rounded text-sm hover:border-orange-500 hover:text-orange-500" aria-label="Следующая страница">&raquo;</a>
    {% endif %}
</nav>
{% endif %}
