{% if messages %}
<div class="max-w-7xl mx-auto px-4 pt-4 space-y-2">
    {% for message in messages %}
    <div class="{% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-700{% elif message.tags == 'warning' %}bg-orange-50 border-orange-200 text-orange-700{% else %}bg-green-50 border-green-200 text-green-700{% endif %} border rounded-lg px-4 py-3 text-sm">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
