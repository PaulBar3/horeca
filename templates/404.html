{% extends "base.html" %}
{% block title %}Страница не найдена — FOODBASE{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-16 text-center">
    <p class="text-7xl font-bold text-orange-500 leading-none">404</p>
    <h1 class="text-2xl font-bold mt-4 mb-3">Страница не найдена</h1>
    <p class="text-gray-500 mb-2">Возможно, страница была перемещена или удалена.</p>
    <p class="text-sm text-gray-400 mb-6 break-all">Адрес: <code class="bg-gray-100 px-1 rounded">{{ request_path }}</code></p>
    <div class="flex justify-center gap-3">
        <a href="{% url 'core:home' %}" class="fc-btn bg-orange-500 text-white px-5 py-2 rounded font-medium hover:bg-orange-600">На главную</a>
        <a href="{% url 'catalog:product_list' %}" class="fc-btn border px-5 py-2 rounded hover:bg-gray-50">В каталог</a>
    </div>
</div>
{% endblock %}
