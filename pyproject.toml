[project]
name = "horeca"
version = "0.1.0"
description = "FOODCORE — каталог полуфабрикатов для HoReCa"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<5.3",
    "pillow>=12.3.0",
    "python-slugify>=9.0.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pylint>=4.0.8",
    "pylint-django>=2.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
source = ["core", "catalog", "orders", "blog", "config"]
omit = ["*/migrations/*", "manage.py", "*/tests.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
