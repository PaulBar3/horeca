databases:
  - name: foodcore-db
    plan: free
    databaseName: foodcore

services:
  - type: web
    plan: free
    name: foodcore
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: foodcore-db
          property: connectionString
