services:
  - type: web
    name: foodcore
    runtime: python
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn config.wsgi:application --config gunicorn.conf.py
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_ALLOWED_HOSTS
        value: foodcore.onrender.com
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodcore-db
          property: connectionString

databases:
  - name: foodcore-db
    plan: free
    databaseName: foodcore
    user: foodcore
