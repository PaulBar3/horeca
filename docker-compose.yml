# FOODBASE на VPS: PostgreSQL + Django (gunicorn) + Caddy (HTTPS)
# Все секреты — в .env (см. .env.example). Запуск: docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodcore}
      POSTGRES_USER: ${POSTGRES_USER:-foodcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Пароль попадает в URL — только латиница/цифры/_/- (иначе URL-encode)
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodcore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-foodcore}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-foodbase.by,www.foodbase.by}
    volumes:
      # Загруженные файлы (фото, PDF) живут на диске хоста и переживают redeploy
      - ./media:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@foodbase.by}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./googledfb032ac7a653f69.html:/srv/gsc/googledfb032ac7a653f69.html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
