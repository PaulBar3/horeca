services:

  # ---- PostgreSQL ----
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodcore}
      POSTGRES_USER: ${POSTGRES_USER:-foodcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---- Django + Gunicorn ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foodcore}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-foodcore}
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - media:/app/media
    networks:
      - internal
      - external

  # ---- Nginx ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    networks:
      - external

volumes:
  postgres_data:
  media:
  staticfiles:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
